<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Új regisztráció – IziÉkszer</title>
</head>
<body style="margin:0; padding:0; background-color:#F8ECE8; font-family: 'Segoe UI', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8ECE8; padding: 32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="520" cellpadding="0" cellspacing="0" style="max-width:520px; width:100%; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e8d5b0;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding: 28px 24px 8px;">
              <img src="https://iziekszer.web.app/pics/main_logo_transparent.png" alt="IziÉkszer" width="72" style="display:block; width:72px; height:auto; border:0;">
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td align="center" style="padding: 0 24px 16px;">
              <p style="margin:0; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#b8944f; font-weight:600;">Admin értesítés</p>
              <h1 style="margin:6px 0 0; font-size:20px; color:#000000; font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-weight: 400;">Új regisztráció érkezett</h1>
            </td>
          </tr>

          <!-- gold divider -->
          <tr>
            <td style="padding: 0 28px;">
              <div style="height:1px; line-height:1px; font-size:1px; background-color:#c9a96e; opacity:0.4;">&nbsp;</div>
            </td>
          </tr>

          <!-- Esemény adatok -->
          <tr>
            <td style="padding: 22px 28px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8ECE8; border-radius:8px;">
                <tr>
                  <td style="padding:16px 18px; border-left:4px solid #c9a96e; font-size:14px; line-height:1.9; color:#333333;">
                    <p style="margin:0"><strong style="color:#b8944f;">Esemény:</strong> {{esemeny_cim}}</p>
                    <p style="margin:0"><strong style="color:#b8944f;">Időpont:</strong> {{esemeny_datum}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Jelentkező adatai -->
          <tr>
            <td style="padding: 16px 28px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8ECE8; border-radius:8px;">
                <tr>
                  <td style="padding:16px 18px; border-left:4px solid #c9a96e; font-size:14px; line-height:1.9; color:#333333;">
                    <p style="margin:0"><strong style="color:#b8944f;">Név:</strong> {{nev}}</p>
                    <p style="margin:0"><strong style="color:#b8944f;">E-mail:</strong> <a href="mailto:{{email}}" style="color:#333333; text-decoration:none;">{{email}}</a></p>
                    <p style="margin:0"><strong style="color:#b8944f;">Telefon:</strong> <a href="tel:{{telefon}}" style="color:#333333; text-decoration:none;">{{telefon}}</a></p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td align="center" style="padding: 24px 28px 8px;">
              <a href="https://iziekszer.web.app/admin/index.html" style="display:inline-block; background:linear-gradient(135deg,#b8944f 0%,#d4b87a 100%); color:#ffffff; font-size:13px; font-weight:600; letter-spacing:1px; text-transform:uppercase; padding:12px 28px; border-radius:30px; text-decoration:none;">Megnyitás az adminban →</a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 20px 28px 28px; font-size:12px; color:#999999;">
              Ez egy automatikus értesítés az IziÉkszer weboldaláról.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
